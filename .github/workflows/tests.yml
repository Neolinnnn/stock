name: 測試

# 程式或 workflow 變更時跑 pytest。僅分支與 PR：main 上多為 bot 的資料 commit，不必每次跑
on:
  push:
    branches-ignore: [main]
    paths: ['**.py', 'tests/**', 'requirements.txt', '.github/workflows/**']
  pull_request:
    paths: ['**.py', 'tests/**', 'requirements.txt', '.github/workflows/**']

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          # ta==0.5.25 (FinMind dep) fails to build with setuptools>=68
          pip install "setuptools<68" -q
          pip install -r requirements.txt pytest -q
      # 不帶任何 secrets：測試不打外部 API（test_daily_scan 的 import 測試以子行程模擬
      # `python scripts/daily_scan.py`，確認 indicators 模組在 CI 的執行方式下載得到）
      - run: python -m pytest -q

  # 暫時性：對本分支在真實 runner 上驗證新鮮度中止與分點抓取，驗證後移除。
  # 不帶 secrets（無 Notion／Sheets／Gemini token），即使未中止也不會對外寫入，且不 commit
  e2e-verify:
    if: github.ref_name == 'claude/busy-dijkstra-yaby0d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          pip install "setuptools<68" -q
          pip install -r requirements.txt -q
      - name: 分點來源可達（histock，從 GitHub runner）
        run: |
          python -c "
          from indicators.broker import fetch_broker_top15, main_force_score
          r = fetch_broker_top15('2330')
          print('source=', r.get('source'), 'error=', r.get('error'), 'buyers=', len(r.get('top_buyers', [])))
          print(main_force_score(r))
          "
      - name: daily_scan 以 CI 方式執行（台灣收盤前應中止、exit 1、不產出報告）
        run: |
          echo "UTC $(date -u '+%F %H:%M')"
          set +e
          python scripts/daily_scan.py > scan.log 2>&1
          code=$?
          set -e
          grep -v ' INFO ' scan.log | tail -30
          echo "exit=$code"
          ls daily_reports | grep "$(date -u +%Y%m%d)" && { echo "::error::產出了報告目錄"; exit 1; } || true
          if [ "$(date -u +%-H)" -lt 9 ]; then
            # UTC 09:00（台灣 17:00）前，FinMind 尚無當日 K 棒（17:30 更新），必須中止
            [ "$code" -ne 0 ] && grep -q '資料非當日，中止' scan.log
          fi

  # 暫時性：移除非交易日報告後重算回測輸出，commit 回本分支，完成後移除此 job
  regen-backtests:
    if: github.ref_name == 'claude/busy-dijkstra-yaby0d'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      FINMIND_TOKEN_1: ${{ secrets.FINMIND_TOKEN_1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          pip install "setuptools<68" -q
          pip install -r requirements.txt -q
      - name: 以 FinMind 驗證被移除的 6 天皆非交易日
        run: |
          python -c "
          import sys; sys.path.insert(0, 'scripts'); import datafeed
          df = datafeed.finmind_fetch('taiwan_stock_daily', stock_id='TAIEX', start_date='2026-04-01', end_date='2026-10-31')
          days = set(df['date'].astype(str))
          bad = [d for d in ('2026-04-18','2026-05-01','2026-06-14','2026-06-19','2026-07-10','2026-10-23') if d in days]
          print('TAIEX 交易日數', len(days), '被移除日期中為交易日者', bad)
          sys.exit(1 if bad else 0)
          "
      - name: 重算回測
        run: |
          python scripts/backtest_all.py
          python scripts/build_backtest_docs.py
          python scripts/sector_rotation_backtest.py
          python scripts/backtest_ma10.py
      - name: Commit 回本分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results*.json docs/backtest_summary*.json docs/backtest/
          git status --short | head -40
          git diff --cached --quiet && { echo "無變更"; exit 0; }
          git commit -m "data: 移除非交易日報告後重算回測（CI）"
          git checkout -- .
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

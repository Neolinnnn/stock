name: 驗證集保大戶資料

# 開發環境無法連線 FinMind，此 workflow 讓 runner 代跑 scripts/verify_holders.py，
# 以確認 taiwan_stock_holding_shares_per 的實際回應格式與解析結果。
on:
  workflow_dispatch:
    inputs:
      stock_id:
        description: '股票代碼（例 2330）'
        required: false
        default: '2330'
        type: string
      weeks:
        description: '取最近幾期'
        required: false
        default: '12'
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # ta==0.5.25 (FinMind dep) fails to build with setuptools>=68
          pip install "setuptools<68" -q
          pip install -r requirements.txt -q

      - name: Verify holders dataset
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FINMIND_TOKEN_1: ${{ secrets.FINMIND_TOKEN_1 }}
        run: |
          python scripts/verify_holders.py \
            "${{ github.event.inputs.stock_id }}" \
            --weeks "${{ github.event.inputs.weeks }}" \
            --dump holders_raw.csv

      - name: Upload raw response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holders-raw
          path: holders_raw.csv
          if-no-files-found: warn

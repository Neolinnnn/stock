name: 每週回測更新

# 回測頁 18 份結果更新到最新（scripts/backtest_all.py）。
# 只在當週最後一個交易日執行（週五休市則提前，見 scripts/trading_calendar.py）。
# 與日掃描分開、排在晚間：FinMind 額度以小時計，日掃描會用盡當下額度，
# 接在同一個 job 跑會抓價失敗（2026-09-24 實測 15 檔被拒，由安全閥中止未發佈）。
on:
  schedule:
    # 21:43 台灣時間 = 13:43 UTC，週一至週五；避開整點／半點（排程壅塞）
    - cron: '43 13 * * 1-5'
  workflow_dispatch:   # 手動觸發不檢查是否為最後交易日

# 不與日掃描共用群組：GitHub 每個群組只保留一個 pending run，後到者會把排隊中的取消
# （cancel-in-progress 只管執行中的），最後交易日日掃描備援 cron 排進來就會擠掉本回測。
# 同時 push 由 commit step 的 rebase 重試處理；FinMind 額度撞車時 backtest_all 的安全閥會中止不發佈
concurrency:
  group: weekly-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - id: decide
        run: |
          read TRADING LAST <<< "$(python3 scripts/trading_calendar.py "$(date -u +%Y%m%d)")"
          RUN=true
          if [ -n "${{ github.event.schedule }}" ] && [ "$LAST" != "true" ]; then RUN=false; fi
          echo "交易日=$TRADING 最後交易日=$LAST → run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.decide.outputs.run == 'true'
        run: |
          # ta==0.5.25 (FinMind dep) fails to build with setuptools>=68
          pip install "setuptools<68" -q
          pip install -r requirements.txt

      - name: Update backtests
        if: steps.decide.outputs.run == 'true'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FINMIND_TOKEN_1: ${{ secrets.FINMIND_TOKEN_1 }}
        run: |
          python scripts/backtest_all.py
          python scripts/build_backtest_docs.py

      - name: Commit
        id: commit
        if: steps.decide.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results*.json docs/backtest_summary*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "auto: 每週回測更新 $(TZ='Asia/Taipei' date '+%Y-%m-%d')"
          # 只推送上面 commit 的結果；其他被腳本改寫的已追蹤檔不推，留著會讓 pull --rebase 失敗
          git checkout -- .
          # -X theirs：rebase 時 theirs 才是本 job 的 commit（ours 是 main），衝突時保留剛產出的結果
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            echo "Push 失敗，第 ${i} 次重試..."
            sleep $((i * 5))
          done
          if [ "$pushed" != true ]; then
            echo "::error::push 連續失敗 3 次，結果未發佈"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        # GITHUB_TOKEN push 不會觸發 deploy_pages.yml，須顯式呼叫
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_pages.yml --ref main
